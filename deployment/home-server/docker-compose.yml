# ===============================
# 自宅Ubuntuサーバー用 Docker Compose設定
# Strapi CMS + PostgreSQL + Cloudflare Tunnel
# ===============================
version: '3.8'

services:
  # Strapi CMS
  strapi:
    image: node:20-alpine
    container_name: strapi-cms
    working_dir: /opt/app
    environment:
      NODE_ENV: production
      # データベース接続
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-strapi}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: false
      # Strapi認証シークレット
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      APP_KEYS: ${APP_KEYS}
      # サーバー設定
      HOST: 0.0.0.0
      PORT: 1337
      # Webhook設定（GitHub Actions連携）
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      # コメントプラグイン設定
      COMMENTS_CONTACT_EMAIL: ${COMMENTS_CONTACT_EMAIL}
      # メール送信（Nodemailer）
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      # タイムゾーン
      TZ: Asia/Tokyo
    volumes:
      - ../../cms:/opt/app
      - strapi_uploads:/opt/app/public/uploads
      - strapi_cache:/opt/app/.cache
    ports:
      - "1337:1337"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npm run build && npm run start"
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1337/_health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # PostgreSQL データベース
  db:
    image: postgres:15-alpine
    container_name: strapi-db
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Tokyo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cloudflare Tunnel（外部からのアクセスを安全に公開）
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      strapi:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  # Redis（オプション：キャッシュ用）
  redis:
    image: redis:7-alpine
    container_name: strapi-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    name: strapi_postgres_data
  strapi_uploads:
    name: strapi_uploads
  strapi_cache:
    name: strapi_cache
  redis_data:
    name: strapi_redis_data
